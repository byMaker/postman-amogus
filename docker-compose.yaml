services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postman_amogus
    restart: always
    ports:
      - "${HOST_APP_PORT:-8473}:3000"
    environment:
      - PORT=3000
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-mail}
      - DB_USER=${DB_USER:-mail_user}
      - DB_PASSWORD=${DB_PASSWORD:-mail_pass}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - amogus-net

networks:
  amogus-net:
    driver: bridge
